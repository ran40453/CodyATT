# Sync Attendance Data
# Converts company Excel attendance records to JSON and pushes to Gist.
#
# Trigger: Push an Excel file to attendance-source/ or run manually.
# Secrets needed:
#   GIST_TOKEN — GitHub PAT with gist scope
#   GIST_ID    — Target Gist ID

name: Sync Attendance Data

on:
  push:
    paths:
      - 'attendance-source/**'
  workflow_dispatch:
    inputs:
      excel_file:
        description: 'Excel filename inside attendance-source/'
        required: true
        default: 'TP出勤_2025.xlsx'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Determine Excel file
        id: files
        run: |
          if [ -n "${{ github.event.inputs.excel_file }}" ]; then
            echo "excel=attendance-source/${{ github.event.inputs.excel_file }}" >> $GITHUB_OUTPUT
          else
            # Auto-detect: use the most recently modified .xlsx
            EXCEL=$(ls -t attendance-source/*.xlsx 2>/dev/null | head -1)
            echo "excel=${EXCEL}" >> $GITHUB_OUTPUT
          fi

      - name: Download current records from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s -H "Authorization: token ${GIST_TOKEN}" \
            "https://api.github.com/gists/${GIST_ID}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); f=d['files'].get('records.json',{}); open('current_records.json','w').write(f.get('content','[]'))"

      - name: Run attendance sync
        run: |
          python FITdata/updateJsonfromFIT.py \
            --excel "${{ steps.files.outputs.excel }}" \
            --json current_records.json \
            --output synced_records.json

      - name: Push updated records to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          CONTENT=$(python3 -c "import json; print(json.dumps(open('synced_records.json').read()))")
          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "{\"files\":{\"records.json\":{\"content\":${CONTENT}}}}" \
            > /dev/null
          echo "✅ Gist updated successfully"
